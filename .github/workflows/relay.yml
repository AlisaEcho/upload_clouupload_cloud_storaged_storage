name: relay
on:
  workflow_dispatch:
    inputs:
      tag:
        description: unique trace tag
        required: true
      url:
        description: source file url
        required: true
      file_name:
        description: target file name (optional)
        required: false
        default: ""

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download file
        env:
          SRC_URL: ${{ inputs.url }}
          SRC_NAME: ${{ inputs.file_name }}
        run: |
          set -euo pipefail
          mkdir -p out
          name="$SRC_NAME"
          if [ -z "$name" ]; then
            name=$(basename "${SRC_URL%%\?*}")
          fi
          if [ -z "$name" ] || [ "$name" = "/" ]; then name="download.bin"; fi
          echo "downloading $SRC_URL -> out/$name"
          curl -L --fail --retry 3 --retry-delay 5 --connect-timeout 30 -o "out/$name" "$SRC_URL"
          ls -lh out
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-${{ inputs.tag }}
          path: out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - uses: geekyeggo/delete-artifact@v5
        continue-on-error: true
        with:
          name: keep-none
          failOnError: false